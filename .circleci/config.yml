version: 2.1
jobs:
  deploy:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Branch name
          command: echo "${CIRCLE_BRANCH}"
      - run:
          name: Install awscli
          command: pip install --user awscli
      - run:
          name: Deploy to S3 bucket
          command: ~/.local/bin/aws s3 sync . s3://ludum-dare-46/${CIRCLE_BRANCH} --exclude '.circleci/*' --exclude '.git/*'  

workflows:
  build-deploy:
    jobs:
      - deploy
